name: Update writeup indexes

on:
  push:
    paths:
      - "seasons/**/README.md"
      - "scripts/update_indexes.py"
      - ".github/workflows/update-indexes.yml"

permissions:
  contents: write

jobs:
  update-indexes:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update indexes
        run: python scripts/update_indexes.py

      - name: Commit index changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md seasons/*/README.md
            git commit -m "Update writeup indexes"
            git push
          fi